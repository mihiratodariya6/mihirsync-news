<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MihirSync | Premium News Oracle</title>
    <style>
        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(11, 15, 25, 0.85); backdrop-filter: blur(8px); overflow-y: auto; }
        .modal-content { background-color: #0f172a; margin: 5% auto; padding: 0; border: 1px solid #38bdf8; border-radius: 16px; width: 90%; max-width: 750px; box-shadow: 0 10px 40px rgba(14, 165, 233, 0.3); animation: slideDown 0.3s ease-out; overflow: hidden; }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-btn { color: #94a3b8; float: right; font-size: 32px; font-weight: bold; margin: 10px 20px; cursor: pointer; transition: 0.2s; background: rgba(0,0,0,0.5); border-radius: 50%; width: 40px; height: 40px; text-align: center; line-height: 35px; position: absolute; right: 0; top: 0; }
        .close-btn:hover { color: #ef4444; background: rgba(255,255,255,0.1); }
        #modal-img { width: 100%; height: 350px; object-fit: cover; border-bottom: 2px solid #1e293b; }
        .modal-body { padding: 30px; }
        .modal-source { background: rgba(52, 211, 153, 0.1); color: #34d399; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        #modal-title { color: #f8fafc; margin: 20px 0 15px 0; line-height: 1.4; font-size: 1.8em; }
        #modal-desc { color: #cbd5e1; font-size: 1.15em; line-height: 1.8; margin-bottom: 20px; }
        .modal-footer { border-top: 1px solid #1e293b; padding-top: 20px; color: #64748b; font-size: 0.85em; text-align: center; }
        /* એકદમ પ્રીમિયમ ડાર્ક થીમ */
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #0b0f19; color: #e2e8f0; }
        
        /* હેડર */
        header { text-align: center; padding: 35px 20px; background: linear-gradient(to right, #0f172a, #1e293b); border-bottom: 1px solid #334155; }
        h1 { margin: 0; color: #38bdf8; font-size: 2.8em; letter-spacing: 1px; }
        h1 span { color: #f8fafc; font-weight: 300; }
        
        /* મેનુ બટન (Tabs) */
        .nav-tabs { display: flex; justify-content: center; gap: 15px; padding: 15px; background-color: #0b0f19; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #1e293b; overflow-x: auto; }
        .tab-btn { background: #1e293b; color: #94a3b8; border: none; padding: 10px 25px; border-radius: 30px; font-size: 1em; cursor: pointer; font-weight: 600; transition: 0.3s; white-space: nowrap; }
        .tab-btn:hover { background: #334155; color: white; }
        .tab-btn.active { background: #0ea5e9; color: white; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); }

        /* ન્યૂઝ ગ્રીડ (કાર્ડ્સની ડીઝાઇન) */
        .news-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; padding: 40px 5%; max-width: 1400px; margin: auto; }
        .news-card { background: #1e293b; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; transition: transform 0.3s; display: flex; flex-direction: column; }
        .news-card:hover { transform: translateY(-8px); border-color: #38bdf8; }
        
        .news-img { width: 100%; height: 200px; object-fit: cover; }
        .news-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .news-meta { font-size: 0.85em; color: #34d399; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
        .news-title { font-size: 1.25em; margin: 0 0 10px 0; line-height: 1.4; color: #f8fafc; }
        .news-desc { font-size: 0.95em; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; }
        .read-btn { align-self: flex-start; padding: 8px 18px; background: rgba(56, 189, 248, 0.1); color: #38bdf8; text-decoration: none; border-radius: 8px; font-weight: 600; transition: 0.2s; }
        .read-btn:hover { background: #38bdf8; color: #0b0f19; }

        /* લોડિંગ ટેક્સ્ટ */
        #loader { text-align: center; width: 100%; padding: 50px; font-size: 1.3em; color: #38bdf8; display: none; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <header>
        <h1>MihirSync <span>Oracle</span></h1>
        <p style="color: #94a3b8; margin-top: 10px;">Your Premium Automated News Feed</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="loadCategory('all_global', this)">🌍 All Global News</button>
        <button class="tab-btn" onclick="loadCategory('india', this)">🇮🇳 India</button>
        <button class="tab-btn" onclick="loadCategory('business', this)">📈 Business & Markets</button>
        <button class="tab-btn" onclick="loadCategory('sports', this)">🏏 Sports</button>
        <button class="tab-btn" onclick="loadCategory('tech', this)">💻 Tech & Games</button>
    </div>

    <div id="news-grid" class="news-container">
        <div id="loader">Fetching latest updates...</div>
    </div>
    <div id="newsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modal-img" src="" alt="News Image">
            <div class="modal-body">
                <span id="modal-source" class="modal-source"></span>
                <h2 id="modal-title"></h2>
                <p id="modal-desc"></p>
                <div class="modal-footer">
                    <p><em>MihirSync Global Aggregator: This content is auto-fetched from verified global sources.</em></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
